name: Release

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional version override (e.g. 2.0.0). Leave blank to auto-increment from latest git tag.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Determine Next Release Version
    runs-on: macos-15
    environment: release
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: calc
        env:
          MANUAL_OVERRIDE: ${{ github.event.inputs.version_override }}
        run: |
          git fetch --tags --force
          if [ -n "$MANUAL_OVERRIDE" ]; then
            ver="${MANUAL_OVERRIDE#v}"
            echo "Using manual version override: $ver"
          else
            latest="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
            echo "Latest tag found: ${latest:-none}"
            if [ -z "$latest" ]; then
              ver="1.2.0"
            else
              clean_ver="${latest#v}"
              IFS=. read -r major minor patch <<< "$clean_ver"
              ver="$major.$((minor + 1)).0"
            fi
            echo "Auto-incremented version to: $ver"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "::notice::Next release version: v$ver (tag: v$ver)"

  build-and-release:
    name: Build, Sign, Notarize & Release macOS DMG
    needs: version
    runs-on: macos-15
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Run Test Suite
        run: swift test -v

      - name: Import Apple Developer ID Certificate
        id: keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::CSC_LINK not configured in environment secrets. Falling back to ad-hoc signature."
            echo "has_identity=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null

          existing=()
          while IFS= read -r k; do [ -n "$k" ] && existing+=("$k"); done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"(.*)"$/\1/')
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$keychain" | grep -m1 "Developer ID Application:" | awk -F'"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application certificate found in imported keychain!"
            echo "has_identity=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Found Developer ID: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "has_identity=true" >> "$GITHUB_OUTPUT"

      - name: Build File Finder Application
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          CODESIGN_IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: ./scripts/build_app.sh

      - name: Package macOS DMG Installer
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          CODESIGN_IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: ./scripts/create_dmg.sh

      - name: Notarize DMG with Apple
        if: steps.keychain.outputs.has_identity == 'true' && env.APPLE_API_KEY_P8 != ''
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          CLEAN_KEY_ID="$(echo -n "$APPLE_API_KEY_ID" | tr -d '[:space:]')"
          CLEAN_ISSUER="$(echo -n "$APPLE_API_ISSUER" | tr -d '[:space:]')"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${CLEAN_KEY_ID}.p8"

          # Write normalized PEM key with linebreaks
          printf '%s\n' "$APPLE_API_KEY_P8" | sed 's/\\n/\n/g' > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          echo "Submitting DMG to Apple Notary Service (Key ID: $CLEAN_KEY_ID, Issuer: $CLEAN_ISSUER)..."
          xcrun notarytool submit "dist/File-Finder.dmg" \
            --key "$API_KEY_PATH" \
            --key-id "$CLEAN_KEY_ID" \
            --issuer "$CLEAN_ISSUER" \
            --wait

          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "dist/File-Finder.dmg"
          for dmg in dist/File-Finder-*.dmg; do
            if [ -f "$dmg" ] && [ "$dmg" != "dist/File-Finder.dmg" ]; then
              xcrun stapler staple "$dmg"
            fi
          done

          echo "Verifying Gatekeeper notarization acceptance..."
          spctl -a -t open --context context:primary-signature -v "dist/File-Finder.dmg"

      - name: Generate Release Checksums
        run: |
          cd dist
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release and Auto-Tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          echo "Creating Release and Auto-tagging $TAG..."
          gh release create "$TAG" \
            dist/File-Finder-*.dmg \
            dist/File-Finder.dmg \
            dist/SHA256SUMS.txt \
            --target main \
            --title "File Finder $TAG" \
            --generate-notes
