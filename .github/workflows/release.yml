name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, Sign, Notarize & Release macOS DMG
    runs-on: macos-15
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Run Test Suite
        run: swift test -v

      - name: Import Apple Developer ID Certificate
        id: keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::CSC_LINK not configured in environment secrets. Falling back to ad-hoc signature."
            echo "has_identity=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null

          existing=()
          while IFS= read -r k; do [ -n "$k" ] && existing+=("$k"); done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"(.*)"$/\1/')
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$keychain" | grep -m1 "Developer ID Application:" | awk -F'"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application certificate found in imported keychain!"
            echo "has_identity=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Found Developer ID: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "has_identity=true" >> "$GITHUB_OUTPUT"

      - name: Build File Finder Application
        env:
          CODESIGN_IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: ./scripts/build_app.sh

      - name: Package macOS DMG Installer
        env:
          CODESIGN_IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: ./scripts/create_dmg.sh

      - name: Notarize DMG with Apple
        if: steps.keychain.outputs.has_identity == 'true' && env.APPLE_API_KEY_P8 != ''
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"

          echo "Submitting DMG to Apple Notary Service..."
          xcrun notarytool submit "dist/File-Finder.dmg" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "dist/File-Finder.dmg"
          for dmg in dist/File-Finder-*.dmg; do
            if [ -f "$dmg" ] && [ "$dmg" != "dist/File-Finder.dmg" ]; then
              xcrun stapler staple "$dmg"
            fi
          done

          echo "Verifying Gatekeeper notarization acceptance..."
          spctl -a -t open --context context:primary-signature -v "dist/File-Finder.dmg"

      - name: Generate Release Checksums
        run: |
          cd dist
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/File-Finder-*.dmg
            dist/File-Finder.dmg
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
