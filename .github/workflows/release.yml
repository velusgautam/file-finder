name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release macOS DMG
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Run Test Suite
        run: swift test -v

      - name: Build File Finder Application
        run: ./scripts/build_app.sh

      - name: Package macOS DMG Installer
        run: ./scripts/create_dmg.sh

      - name: Generate Release Checksums
        run: |
          cd dist
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/File-Finder-*.dmg
            dist/File-Finder.dmg
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
