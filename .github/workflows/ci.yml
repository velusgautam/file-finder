name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run Tests
        run: swift test -v

      - name: Build App
        run: ./scripts/build_app.sh

      - name: Package DMG
        run: ./scripts/create_dmg.sh
